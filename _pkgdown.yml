  - v07-integer-support-regression
  - v11-distribution-free-uncertainty-and-diagnostics
  - v12-optima-quantiles-and-block-structure
  - v14-from-curve-to-decision
  - v15-testing-assumptions-and-difficult-data
- title: Data that are not measurements
  contents:
