url: https://wep69.github.io/agriRank/

template:
  bootstrap: 5

reference:
- title: Declare the design
  desc: Every analysis starts from an explicit randomization structure.
  contents: [agri_design, validate_agri_design, design_summary, simulate_agri]

- title: Design-aware inference
  contents: [agri_rank, agri_repeated, agri_multivariate, agri_multienv,
             np_crd, np_rcbd, np_factorial, np_splitplot, np_splitsplit,
             np_stripplot, np_repeated, incomplete_wild_rank_test]

- title: Effects, comparisons and contrasts
  contents: [agri_effects, agri_pairs, agri_conover, agri_cld, agri_contrast]

- title: Regression for quantitative gradients
  desc: >
    Continuous smoothers, shape constraints and rank-robust slopes for
    fertilizer rates, salinity, irrigation and other agronomic gradients.
  contents: [agri_np_regression, agri_np_predict, agri_np_plot,
             agri_np_derivative, agri_np_optimum, agri_np_bootstrap,
             agri_np_compare, agri_np_diagnostics, agri_np_significance,
             agri_np_specification, agri_np_interactive,
             agri_np_extractors, agri_np_curves, agri_np_regression_plots,
             agri_np_forest, agri_np_levels]

- title: Distribution-free uncertainty and model checking
  desc: >
    Where the response is really changing, what interval covers the next plot,
    and whether the fit describes the data, all without a distributional
    assumption.
  contents: [agri_np_sizer, agri_np_conformal, agri_np_simdiag,
             agri_np_effect_test, agri_np_shape_test]

- title: Data the cross-sectional module cannot hold
  desc: >
    Plots measured more than once, several responses to the same gradient, and
    plots that were lost.
  contents: [agri_np_longitudinal, agri_np_multiresponse, agri_np_impute]

- title: From a curve to a recommendation
  desc: >
    What rate to recommend and with what interval, whether an optimum exists at
    all, what the poor plots do rather than the average one, and how the
    declared block enters the model.
  contents: [agri_np_optimum_test, agri_np_optimum_economic,
             agri_np_optimum_surface, agri_np_quantile_curves,
             agri_np_block_effects]

- title: When the datum is not a measurement
  desc: >
    Germination and emergence, counted inside intervals and censored at the end
    of the trial, and on-farm trials in which the datum is an order rather than
    a measurement.
  contents: [agri_np_timetoevent, agri_rankings]

- title: Integer decision support
  desc: >
    Treatments that can only take whole values, such as plants per hill,
    irrigation events or sprays.
  contents: [agri_integer_predict, agri_integer_optimum,
             agri_integer_difference, agri_integer_threshold,
             agri_integer_efficiency, agri_integer_bootstrap,
             agri_integer_confset]

- title: Missing data and sensitivity
  contents: [agri_missing_report, agri_missing_sensitivity, agri_sensitivity,
             agri_batch]

- title: Trend, covariance and power
  contents: [agri_trend, agri_ancova, agri_power]

- title: Graphics, tables and reports
  contents: [agri_plot, agri_interactive, agri_table, agri_dashboard,
             agri_report, export_results, agri_methods,
             agri_graphics, agri_format_ci, agri_broom]

- title: Example data
  desc: Shared data sets used across the examples and vignettes.
  contents: [agri_dose, agri_density, agri_surface]

